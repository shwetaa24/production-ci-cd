name: Production Flask CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. ADD THIS SECTION: This defines the variable for the whole file
env:
  DOCKER_IMAGE: shwetaajadhav/flask-app:latest

jobs:
  Quality-Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit Tests
        run: pytest

  Build-and-Push:
    needs: Quality-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Scan Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          # 2. Use the variable here
          tags: ${{ env.DOCKER_IMAGE }}
          load: true 

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          # 3. This now works because we defined env at the top
          image-ref: ${{ env.DOCKER_IMAGE }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push to Docker Hub
        if: success()
        # 4. Use the variable here too
        run: docker push ${{ env.DOCKER_IMAGE }}