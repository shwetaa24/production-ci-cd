Build-and-Push:
    needs: Quality-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Use your exact secret names from your screenshot
          username: ${{ secrets.DOCKERUN }}
          password: ${{ secrets.PRODUCTION_CI }}

      - name: Build and Scan Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: shwetaajadhav/flask-app:latest
          load: true 

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shwetaajadhav/flask-app:latest'
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Push to Docker Hub
        if: success()
        run: docker push shwetaajadhav/flask-app:latest